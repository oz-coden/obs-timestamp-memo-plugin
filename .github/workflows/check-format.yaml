name: Check Code Formatting
on:
  workflow_call:
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned format tools
        run: python -m pip install clang-format==19.1.1 gersemi==0.21.0
      - name: Check C++ and CMake formatting
        shell: bash
        run: |
          mapfile -d '' sources < <(git ls-files -z '*.c' '*.h' '*.cpp' '*.hpp' '*.m' '*.mm')
          clang-format --dry-run --Werror "${sources[@]}"
          mapfile -d '' cmake_files < <(git ls-files -z '*.cmake' '*CMakeLists.txt')
          gersemi --check "${cmake_files[@]}"
